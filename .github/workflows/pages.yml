name: 發布 Bangkok Travel Guide 至 GitHub Pages

# 只有手動執行才發布；第一次推送或之後儲存程式不會自動公開網站。
on:
  workflow_dispatch:
    inputs:
      confirm_public_release:
        description: 已確認公開網站、示範資料及素材範圍
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirm_public_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 讀取已提交的網站程式
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 設定 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: 安裝指定版本的 pnpm（只在 GitHub 執行環境）
        run: npm install --global pnpm@11.19.0 --ignore-scripts
      - name: 檢查公開檔案
        run: node scripts/security-check.mjs --staged
      - name: 安裝已鎖定的網站套件
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 執行核心測試
        run: pnpm test
      - name: 產生 Pages 發布檔
        run: pnpm build:pages
      - name: 檢查資源路徑
        run: pnpm check:pages
      - name: 讀取 Pages 設定
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: 上傳網站建置成果
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
